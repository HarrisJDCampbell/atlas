[package]
name = "atlas"
version = "0.1.0"
description = "Atlas — local mission control"
authors = ["Harris Campbell"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }
futures-util = "0.3.34"
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "query"] }
keyring = { version = "3", features = ["apple-native"] }
sysinfo = "0.39.6"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2"
html2text = "0.17.4"
uuid = { version = "1.28.0", features = ["v4"] }
mailparse = "0.18.0"
axum = "0.8"
regex = "1.13.1"
include_dir = "0.7.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
